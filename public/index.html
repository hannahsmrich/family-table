<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Family Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf8f5;color:#2c2a26;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:1.5rem 1rem 7rem}
h1{font-family:'Lora',serif;font-size:28px;font-weight:400;color:#2c2a26;margin-bottom:4px}
h2{font-family:'Lora',serif;font-size:20px;font-weight:400;color:#2c2a26;margin-bottom:0.25rem}
h3{font-size:13px;font-weight:500;color:#5f5e5a;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.75rem}
p{font-size:15px;line-height:1.6;color:#3a3936}
.tagline{font-family:'Lora',serif;font-style:italic;font-size:15px;color:#888780}
.card{background:#fff;border-radius:16px;border:0.5px solid #e8e5df;padding:1.25rem 1.5rem;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:0.5px solid #d3d1c7;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;color:#2c2a26}
.btn:hover{background:#f1efe8}
.btn-primary{background:#3b6d11;color:#fff;border-color:#3b6d11}
.btn-primary:hover{background:#27500a}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:15px}
input[type=text],input[type=number],input[type=email],select{width:100%;padding:10px 14px;border-radius:10px;border:0.5px solid #d3d1c7;background:#faf8f5;font-family:'DM Sans',sans-serif;font-size:14px;color:#2c2a26;outline:none;transition:border 0.15s}
input:focus,select:focus{border-color:#639922}
label{font-size:14px;font-weight:500;color:#444441;display:block;margin-bottom:6px}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:#888780;margin:1.25rem 0 0.5rem;padding-top:1rem;border-top:0.5px solid #e8e5df}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none}
.nav{display:flex;gap:4px;margin-bottom:2rem;background:#f1efe8;border-radius:12px;padding:4px}
.nav-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:#888780;transition:all 0.15s}
.nav-btn.active{background:#fff;color:#2c2a26;border:0.5px solid #e8e5df}
.page-header{margin-bottom:1.5rem}
.page-header h1{font-size:14px;font-weight:500;color:#888780;text-transform:uppercase;letter-spacing:0.08em;font-family:'DM Sans',sans-serif;margin-bottom:6px}
.page-header h2{font-family:'Lora',serif;font-size:22px;font-weight:400;color:#2c2a26;margin-bottom:0}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.app-wordmark{font-family:'Lora',serif;font-size:15px;font-style:italic;color:#888780}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;background:#eaf3de;color:#3b6d11}
.add-link{font-size:13px;color:#639922;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;padding:0;text-decoration:underline;margin-top:4px}
.kid-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.remove-btn{background:none;border:none;cursor:pointer;color:#d3d1c7;font-size:18px;line-height:1;padding:0 4px}
.remove-btn:hover{color:#e24b4a}
.loading{text-align:center;padding:4rem 1rem}
.loading-text{font-family:'Lora',serif;font-style:italic;font-size:18px;color:#888780;margin-top:1rem}
.loading-sub{font-size:13px;color:#888780;margin-top:0.5rem}
.spinner{width:44px;height:44px;border:2px solid #e8e5df;border-top:2px solid #639922;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress bar */
.progress-wrap{margin-bottom:2rem}
.progress-steps{display:flex;align-items:center;gap:0;margin-bottom:8px}
.progress-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.progress-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;height:2px;background:#e8e5df;z-index:0}
.progress-step.done::after{background:#639922}
.progress-dot{width:28px;height:28px;border-radius:50%;border:2px solid #e8e5df;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#b4b2a9;position:relative;z-index:1;transition:all 0.3s}
.progress-step.done .progress-dot{background:#639922;border-color:#639922;color:#fff}
.progress-step.active .progress-dot{background:#fff;border-color:#639922;color:#639922}
.progress-label{font-size:10px;color:#888780;margin-top:4px;text-align:center;font-weight:500}
.progress-step.active .progress-label{color:#3b6d11;font-weight:600}
.progress-step.done .progress-label{color:#639922}

/* Meal mode */
.meal-mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.meal-mode-card{padding:12px;border-radius:10px;border:0.5px solid #d3d1c7;background:#fff;cursor:pointer;transition:all 0.15s;text-align:left}
.meal-mode-card:hover{background:#f1efe8}
.meal-mode-card.active{background:#eaf3de;border-color:#639922}
.meal-mode-card .mode-title{font-size:13px;font-weight:500;color:#2c2a26;margin-bottom:3px}
.meal-mode-card.active .mode-title{color:#3b6d11}
.meal-mode-card .mode-desc{font-size:12px;color:#555350;line-height:1.4}
.taste-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.taste-card{padding:12px;border-radius:10px;border:0.5px solid #d3d1c7;background:#fff;cursor:pointer;transition:all 0.15s}
.taste-card:hover{background:#f1efe8}
.taste-card.active{background:#eaf3de;border-color:#639922}
.taste-card .taste-title{font-size:13px;font-weight:500;color:#2c2a26;margin-bottom:2px}
.taste-card.active .taste-title{color:#3b6d11}
.taste-card .taste-desc{font-size:12px;color:#888780}

/* Idea picker */
.meal-idea-card{background:#fff;border-radius:14px;border:1.5px solid #e8e5df;padding:1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:all 0.15s;display:flex;align-items:flex-start;gap:14px}
.meal-idea-card:hover{border-color:#c0dd97;background:#fafff8}
.meal-idea-card.selected{border-color:#639922;background:#eaf3de}
.meal-idea-card.new-idea{border-left:3px solid #639922}
.meal-idea-check{width:22px;height:22px;border-radius:6px;border:1.5px solid #d3d1c7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:13px;color:#fff}
.meal-idea-card.selected .meal-idea-check{background:#639922;border-color:#639922}
.meal-idea-body{flex:1}
.meal-idea-name{font-family:'Lora',serif;font-size:16px;font-weight:400;color:#2c2a26;margin-bottom:3px}
.meal-idea-card.selected .meal-idea-name{color:#27500a}
.meal-idea-desc{font-size:13px;color:#555350;line-height:1.5}
.new-badge{font-size:10px;font-weight:600;background:#639922;color:#fff;padding:2px 7px;border-radius:5px;margin-left:8px;vertical-align:middle}
.selection-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e8e5df;padding:1rem;z-index:50}
.selection-bar-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.selection-count{font-size:13px;color:#888780;flex:1}

/* Calendar */
.week-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.day-row{display:flex;align-items:stretch;gap:10px;min-height:72px}
.day-label{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day-abbr{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#888780}
.day-slot{flex:1;border-radius:12px;border:0.5px solid #e8e5df;background:#fff;padding:10px 14px;cursor:pointer;transition:all 0.15s;position:relative;min-height:72px}
.day-slot.draggable{cursor:grab}
.day-slot.dragging{opacity:0.4;border-style:dashed}
.day-slot.drag-over{border-color:#639922;background:#eaf3de}
.day-slot.empty-slot{background:#faf8f5;border-style:dashed;display:flex;align-items:center;justify-content:center}
.day-slot.empty-slot:hover{background:#f1efe8;border-color:#c0dd97}
.slot-add-hint{font-size:13px;color:#4a8a18;font-weight:500}
.slot-meal-name{font-family:'Lora',serif;font-size:15px;font-weight:400;color:#2c2a26;margin-bottom:2px;line-height:1.3;padding-right:20px}
.slot-meal-desc{font-size:12px;color:#888780;line-height:1.4;padding-right:20px}
.slot-special{display:flex;flex-direction:column;justify-content:center;min-height:52px}
.slot-tag{font-size:13px;font-weight:500;padding:6px 12px;border-radius:8px;display:inline-block;margin-bottom:4px}
.tag-out{background:#faeeda;color:#ba7517}
.tag-order{background:#e6f1fb;color:#185fa5}
.tag-leftover{background:#eaf3de;color:#3b6d11}
.slot-tag-note{font-size:12px;color:#888780;margin-top:2px;font-style:italic}
.slot-actions{position:absolute;top:8px;right:10px;opacity:0;transition:opacity 0.15s}
.day-slot:hover .slot-actions{opacity:1}
.slot-action-btn{background:none;border:none;cursor:pointer;font-size:16px;color:#b4b2a9;padding:0;line-height:1}
.slot-action-btn:hover{color:#e24b4a}
.recipe-link{font-size:13px;color:#3b6d11;font-weight:600;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;margin-top:6px;display:block}
.recipe-link:hover{text-decoration:underline}
.tray-wrap{background:#fff;border:0.5px solid #e8e5df;border-radius:12px;padding:8px;margin-top:4px}
.option-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.1s}
.option-item:hover{background:#f1efe8}
.option-name{font-family:'Lora',serif;font-size:14px;color:#2c2a26;margin-bottom:2px}
.option-desc{font-size:12px;color:#888780}
.special-row{display:flex;gap:6px;margin-bottom:8px}
.special-btn{flex:1;padding:14px 4px;border-radius:10px;border:0.5px solid #e8e5df;background:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.1s}
.special-btn:hover{background:#f1efe8}
.tray-divider{height:0.5px;background:#f1efe8;margin:4px 0 8px}
.tray-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#888780;margin-bottom:6px;padding:0 4px}
.writein-row{display:flex;gap:8px;padding:4px}
.writein-row input{flex:1;padding:12px 14px;font-size:15px}
.generate-bar{position:sticky;bottom:0;background:linear-gradient(to top,#faf8f5 70%,transparent);padding:1.5rem 0 0.5rem;margin-top:0.5rem}

/* Grocery */
.grocery-section{margin-bottom:1.25rem}
.grocery-cat{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#639922;margin-bottom:0.5rem}
.grocery-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid #f1efe8;font-size:14px;color:#2c2a26}
.grocery-item:last-child{border-bottom:none}
.grocery-name{flex:1}
.grocery-qty{font-size:12px;color:#888780;margin-right:8px}
.check-bought{width:20px;height:20px;border-radius:5px;border:1.5px solid #c0dd97;background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:11px}
.check-bought.checked{background:#639922;border-color:#639922;color:#fff}
.check-have{width:20px;height:20px;border-radius:50%;border:1.5px solid #d3d1c7;background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:10px;color:#888780}
.check-have.checked{background:#f1efe8;border-color:#888780;color:#2c2a26}
.grocery-labels{display:flex;gap:4px;margin-bottom:4px;font-size:10px;color:#b4b2a9;font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.grocery-add-row{display:flex;gap:8px;margin-top:0.75rem}
.grocery-add-row input{flex:1}

/* Week summary */
.tonight-card{background:#fff;border-radius:16px;border:0.5px solid #e8e5df;padding:1.5rem;margin-bottom:1rem;cursor:pointer;transition:all 0.15s}
.tonight-card:hover{border-color:#c0dd97}
.tonight-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:#639922;margin-bottom:6px}
.tonight-name{font-family:'Lora',serif;font-size:22px;font-weight:400;color:#2c2a26;margin-bottom:4px}
.tonight-desc{font-size:14px;color:#888780;margin-bottom:1rem}
.week-summary-card{background:#fff;border-radius:12px;border:0.5px solid #e8e5df;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:all 0.15s}
.week-summary-card.has-meal{cursor:pointer}
.week-summary-card.has-meal:hover{border-color:#c0dd97;background:#fafff8}
.week-summary-card.no-meal{background:#faf8f5}
.week-summary-day{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#888780;width:32px;flex-shrink:0}
.week-summary-day.today{color:#639922}
.week-summary-name{font-family:'Lora',serif;font-size:15px;color:#2c2a26;flex:1}
.week-summary-special{font-size:13px;color:#888780;flex:1;font-style:italic}
.week-summary-arrow{font-size:13px;color:#3b6d11;font-weight:600}
.email-section{margin-top:1.5rem;padding-top:1.5rem;border-top:0.5px solid #e8e5df}
.email-row{display:flex;gap:8px;margin-top:8px}
.email-row input{flex:1}
.bookmark-tip{margin-top:1.5rem;padding:1.25rem;background:#2c2a26;border-radius:12px}
.bookmark-tip-title{color:#e8e5df;font-size:13px;font-weight:600;margin-bottom:4px}
.bookmark-tip-body{color:#888780;font-size:12px;margin-bottom:6px}
.bookmark-tip-url{color:#639922;font-size:12px;word-break:break-all}

/* Recipe */
.recipe-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,42,38,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.recipe-sheet{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;max-width:680px;width:100%;max-height:85vh;overflow-y:auto}
.recipe-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.75rem}
.recipe-actions{display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:12px}
.close-btn{background:none;border:none;font-size:24px;cursor:pointer;color:#888780;line-height:1}
.heart-btn{background:none;border:none;font-size:22px;cursor:pointer;line-height:1;transition:transform 0.15s}
.heart-btn:hover{transform:scale(1.2)}
.step{display:flex;gap:12px;margin-bottom:1rem;font-size:14px;line-height:1.6;color:#444441}
.step-num{width:24px;height:24px;border-radius:50%;background:#eaf3de;color:#3b6d11;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ing-list{margin:0.75rem 0;padding-left:1rem}
.ing-list li{font-size:14px;color:#444441;padding:3px 0;line-height:1.5}
.empty-state{text-align:center;padding:3rem 1rem;color:#888780;font-size:14px}
.api-key-screen{max-width:480px;margin:4rem auto;padding:2rem;text-align:center}
.api-key-screen h2{font-family:'Lora',serif;font-size:24px;font-weight:400;margin-bottom:0.75rem}
.api-key-screen p{font-size:14px;color:#888780;margin-bottom:1.5rem;line-height:1.6}
.api-key-input{display:flex;gap:8px;margin-bottom:0.75rem}
.api-key-input input{flex:1;font-family:monospace;font-size:13px}
.api-note{font-size:12px;color:#b4b2a9;line-height:1.5}
.error-msg{background:#fcebeb;border:0.5px solid #f09595;border-radius:10px;padding:10px 14px;font-size:13px;color:#a32d2d;margin-bottom:1rem}
.fav-card{background:#fff;border-radius:14px;border:0.5px solid #e8e5df;padding:1rem 1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.15s}
.fav-card:hover{border-color:#c0dd97;background:#fafff8}
.fav-name{font-family:'Lora',serif;font-size:15px;color:#2c2a26;flex:1}
.fav-desc{font-size:12px;color:#888780;margin-top:2px}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script>
const STORAGE_KEY='family-table-v4';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY=new Date();
const DAY_START=TODAY.getDay();
const WEEK_DAYS=DAYS.slice(DAY_START).concat(DAYS.slice(0,DAY_START));
const TODAY_NAME=DAYS[TODAY.getDay()];

const STEPS=[
  {id:'profile',label:'Family'},
  {id:'ideas',label:'Meal ideas'},
  {id:'calendar',label:'Your week'},
  {id:'grocery',label:'Grocery list'},
];

const TASTE_OPTIONS=[
  {id:'light',title:'Light & fresh',desc:'Salads, fish, bright flavors'},
  {id:'comfort',title:'Comfort food',desc:'Hearty, warm, filling'},
  {id:'global',title:'Global flavors',desc:'Thai, Mexican, Mediterranean'},
  {id:'veggie',title:'Vegetable-forward',desc:'Plants at the center'},
  {id:'quick',title:'Minimal & quick',desc:'Few ingredients, fast'},
  {id:'bold',title:'Bold & spicy',desc:'Big flavors, heat'},
];

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return{};}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){}}

let state={
  screen:'plan',planStep:'profile',
  profile:null,
  mealOptions:[],selectedMeals:{},
  weekSlots:WEEK_DAYS.map(d=>({day:d,assigned:null})),
  recipesGenerated:false,groceryList:null,manualGrocery:[],
  boughtItems:{},haveItems:{},
  openRecipe:null,loading:false,loadingMsg:'',loadingSub:'',
  openTray:null,apiKey:'',apiKeyInput:'',apiError:'',
  favorites:{},
};
Object.assign(state,loadData());
if(!state.weekSlots||state.weekSlots.length!==7)state.weekSlots=WEEK_DAYS.map(d=>({day:d,assigned:null}));
if(!state.selectedMeals)state.selectedMeals={};
if(!state.apiKey)state.apiKey='';
if(!state.favorites)state.favorites={};
if(!state.manualGrocery)state.manualGrocery=[];
if(!state.boughtItems)state.boughtItems={};
if(!state.haveItems)state.haveItems={};
if(!state.planStep)state.planStep='profile';

// Smart return: go to week view if plan is done
if(state.apiKey&&state.profile&&state.recipesGenerated){state.screen='plan';state.planStep='week';}
else if(state.apiKey&&state.profile&&state.mealOptions.length){state.screen='plan';state.planStep='ideas';}
else if(state.apiKey&&state.profile){state.screen='plan';state.planStep='ideas';}
else if(state.apiKey){state.screen='plan';state.planStep='profile';}

function persist(){saveData({profile:state.profile,weekSlots:state.weekSlots,mealOptions:state.mealOptions,selectedMeals:state.selectedMeals,planStep:state.planStep,recipesGenerated:state.recipesGenerated,groceryList:state.groceryList,manualGrocery:state.manualGrocery,boughtItems:state.boughtItems,haveItems:state.haveItems,favorites:state.favorites});}

let dragSrc=null;
let onboardingForm={kids:[{age:''}],cookTime:'30',restrictions:'',picky:'',mealMode:'family',tasteProfile:[]};

function isFav(name){return !!state.favorites[name];}
function toggleFav(meal){if(state.favorites[meal.name])delete state.favorites[meal.name];else state.favorites[meal.name]=meal;persist();}
function selectedCount(){return Object.keys(state.selectedMeals).length;}
function currentStepIndex(){
  if(!state.profile)return 0;
  if(state.planStep==='profile')return 0;
  if(state.planStep==='ideas')return 1;
  if(state.planStep==='calendar')return 2;
  if(state.planStep==='week')return state.groceryList?4:3;
  if(state.screen==='grocery')return 4;
  return 0;
}

function render(){
  const root=document.getElementById('root');root.innerHTML='';
  // No API key needed - handled by backend
  if(state.loading){root.appendChild(renderLoading());return;}
  if(state.openRecipe){root.appendChild(renderShell());root.appendChild(renderRecipeModal());return;}
  root.appendChild(renderShell());
}

function renderShell(){
  const wrap=document.createElement('div');
  // Top bar
  const topBar=document.createElement('div');topBar.className='top-bar';
  topBar.innerHTML=`<span></span>`;
  if(state.profile){
    const editBtn=document.createElement('button');editBtn.className='btn btn-sm';editBtn.textContent='Edit family';

    if(!state.profile||state.planStep==='profile')wrap.appendChild(renderOnboarding());

  if(state.screen==='grocery')wrap.appendChild(renderGrocery());

}

function renderProgress(activeIdx){

      const sp=document.createElement('div');sp.className='week-summary-special';sp.textContent='Nothing planned';card.appendChild(sp);

    d.appendChild(card);
  });

  const emailSec=document.createElement('div');emailSec.className='email-section';
  emailSec.innerHTML=`<h3>Optional: Email this week's plan to yourself</h3><p style="font-size:13px;color:#888780;margin-bottom:8px">Get your meal plan and recipes in your inbox so you have it all week.</p>`;
  const emailRow=document.createElement('div');emailRow.className='email-row';
  const emailInput=document.createElement('input');emailInput.type='email';emailInput.placeholder='your@email.com';
  const emailBtn=document.createElement('button');emailBtn.className='btn btn-sm';emailBtn.textContent='Send';
  emailBtn.onclick=()=>{const email=emailInput.value.trim();if(!email)return;sendEmailPlan(email);emailBtn.textContent='Sent!';emailBtn.style.color='#639922';setTimeout(()=>{emailBtn.textContent='Send';emailBtn.style.color='';},3000);};
  emailRow.appendChild(emailInput);emailRow.appendChild(emailBtn);emailSec.appendChild(emailRow);d.appendChild(emailSec);

  const tip=document.createElement('div');tip.className='bookmark-tip';
  tip.innerHTML=`<p class="bookmark-tip-title">📌 How to get back here all week</p><p class="bookmark-tip-body">Bookmark this page in your browser so you can open it any night to see what's for dinner.</p><span class="bookmark-tip-url">${window.location.href}</span>`;
  d.appendChild(tip);

  if(state.groceryList){
    const gb=document.createElement('button');gb.className='btn btn-primary btn-full';gb.style.marginTop='1.5rem';gb.textContent='View grocery list';
    gb.onclick=()=>{state.screen='grocery';render();};d.appendChild(gb);
  }

  // Plan next week
  const nextWeekCard=document.createElement('div');
  nextWeekCard.style.cssText='margin-top:1.5rem;padding:1.25rem;background:#fff;border-radius:14px;border:0.5px solid #e8e5df;display:flex;align-items:center;justify-content:space-between;gap:12px';
  nextWeekCard.innerHTML=`<div><p style="font-size:14px;font-weight:500;color:#2c2a26;margin-bottom:2px">Ready for next week?</p><p style="font-size:13px;color:#888780;margin:0">Your family profile is saved — just pick new meals.</p></div>`;
  const nextBtn=document.createElement('button');nextBtn.className='btn btn-primary btn-sm';nextBtn.textContent='Plan next week';
  nextBtn.onclick=()=>{
    state.mealOptions=[];state.selectedMeals={};
    state.weekSlots=WEEK_DAYS.map(d=>({day:d,assigned:null}));
    state.planStep='ideas';state.recipesGenerated=false;
    state.groceryList=null;state.manualGrocery=[];
    state.boughtItems={};state.haveItems={};
    state.screen='plan';persist();generateMealOptions();
  };
  nextWeekCard.appendChild(nextBtn);d.appendChild(nextWeekCard);
  return d;
}

function renderGrocery(){
  const d=document.createElement('div');
  const ph=document.createElement('div');ph.className='page-header';ph.style.marginBottom='1rem';
  ph.innerHTML=`<h2 style="font-family:'Lora',serif;font-size:26px;font-weight:400;color:#2c2a26">The Family Table</h2><p style="font-size:14px;color:#6b6966;margin-top:2px">Grocery list</p>`;d.appendChild(ph);

  if(!state.groceryList){d.innerHTML+=`<div class="empty-state"><p style="font-size:32px;margin-bottom:1rem">🛒</p><p>Finalize your meal plan first and tap "Get full recipes + grocery list."</p></div>`;return d;}

  // Legend
  const legend=document.createElement('div');legend.style.cssText='margin-bottom:1rem;font-size:13px;color:#555350;background:#eaf3de;padding:10px 14px;border-radius:10px;line-height:1.5';
  legend.textContent='Check off what you already have, then check off as you shop.';
  d.appendChild(legend);

  const copyBtn=document.createElement('button');copyBtn.className='btn btn-sm';copyBtn.style.marginBottom='1rem';copyBtn.textContent='Copy full list';
  copyBtn.addEventListener('click',()=>{
    let text='Grocery List\n\n';
    Object.entries(state.groceryList).forEach(([cat,items])=>{if(items&&items.length){text+=cat+':\n';items.forEach(i=>{text+='• '+i+'\n';});text+='\n';}});
    if(state.manualGrocery.length){text+='Other:\n';state.manualGrocery.forEach(i=>{text+='• '+i+'\n';});}
    navigator.clipboard.writeText(text).catch(()=>{});copyBtn.textContent='Copied!';setTimeout(()=>{copyBtn.textContent='Copy full list';},2000);
  });
  d.appendChild(copyBtn);

  Object.entries(state.groceryList).forEach(([cat,items])=>{
    if(!items||!items.length)return;
    const sec=document.createElement('div');sec.className='grocery-section';sec.appendChild(Object.assign(document.createElement('div'),{className:'grocery-cat',textContent:cat}));
    items.forEach(item=>{
      const bKey='b:'+cat+':'+item;const hKey='h:'+cat+':'+item;
      const isBought=!!state.boughtItems[bKey];
      const row=document.createElement('div');row.className='grocery-item';
      if(isBought)row.style.opacity='0.5';

      // Item name + qty
      const nameWrap=document.createElement('div');nameWrap.className='grocery-name';
      // Parse quantity from item string if present
      // Clean up quantity display
      const qtyMatch=item.match(/^(\d+\.?\d*\s*(?:cups?|lbs?|pounds?|oz|ounces?|cloves?|heads?|bunches?|cans?|jars?|pieces?|medium|large|small|inch|tbsp|tsp|pkg|package|bunch)?)\s+(.+)$/i);
      if(qtyMatch&&qtyMatch[1]&&qtyMatch[2]){
        nameWrap.innerHTML=`<span class="grocery-qty" style="min-width:60px;flex-shrink:0">${qtyMatch[1]}</span><span>${qtyMatch[2]}</span>`;
        nameWrap.style.display='flex';nameWrap.style.gap='8px';nameWrap.style.alignItems='baseline';
      } else {
        nameWrap.textContent=item;
      }

      // Bought toggle (square)
      const boughtBox=document.createElement('div');boughtBox.className='check-bought'+(isBought?' checked':'');boughtBox.title='Mark as bought';boughtBox.textContent=isBought?'✓':'';
      boughtBox.addEventListener('click',()=>{
        state.boughtItems[bKey]=!state.boughtItems[bKey];persist();
        boughtBox.className='check-bought'+(state.boughtItems[bKey]?' checked':'');boughtBox.textContent=state.boughtItems[bKey]?'✓':'';
        row.style.opacity=state.boughtItems[bKey]?'0.5':'1';
      });

      row.appendChild(nameWrap);row.appendChild(boughtBox);sec.appendChild(row);
    });
    d.appendChild(sec);
  });

  // Manual additions
  if(state.manualGrocery.length){
    const manSec=document.createElement('div');manSec.className='grocery-section';manSec.appendChild(Object.assign(document.createElement('div'),{className:'grocery-cat',textContent:'Added by you'}));
    state.manualGrocery.forEach((item,i)=>{
      const bKey='b:manual:'+item;
      const isBought=!!state.boughtItems[bKey];
      const row=document.createElement('div');row.className='grocery-item';if(isBought)row.style.opacity='0.5';
      const nameWrap=document.createElement('div');nameWrap.className='grocery-name';nameWrap.textContent=item;
      const del=document.createElement('button');del.style.cssText='background:none;border:none;color:#d3d1c7;cursor:pointer;font-size:16px;padding:0 4px';del.textContent='×';del.onclick=()=>{state.manualGrocery.splice(i,1);persist();render();};
      const boughtBox=document.createElement('div');boughtBox.className='check-bought'+(isBought?' checked':'');boughtBox.textContent=isBought?'✓':'';
      boughtBox.addEventListener('click',()=>{state.boughtItems[bKey]=!state.boughtItems[bKey];persist();boughtBox.className='check-bought'+(state.boughtItems[bKey]?' checked':'');boughtBox.textContent=state.boughtItems[bKey]?'✓':'';row.style.opacity=state.boughtItems[bKey]?'0.5':'1';});
      row.appendChild(nameWrap);row.appendChild(del);row.appendChild(boughtBox);manSec.appendChild(row);
    });
    d.appendChild(manSec);
  }

  // Add your own
  const addSec=document.createElement('div');addSec.style.marginTop='1.25rem';
  addSec.appendChild(Object.assign(document.createElement('div'),{className:'grocery-cat',textContent:'Add anything else you need'}));
  const addRow=document.createElement('div');addRow.className='grocery-add-row';
  const addInput=document.createElement('input');addInput.type='text';addInput.placeholder='e.g. more eggs, snacks for kids, milk...';
  const addBtn=document.createElement('button');addBtn.className='btn btn-sm';addBtn.textContent='Add';
  addBtn.addEventListener('click',()=>{const val=addInput.value.trim();if(val&&!state.manualGrocery.includes(val)){state.manualGrocery.push(val);persist();render();}addInput.value='';});
  addInput.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});
  addRow.appendChild(addInput);addRow.appendChild(addBtn);addSec.appendChild(addRow);d.appendChild(addSec);
  return d;
}

function renderFavorites(){
  const d=document.createElement('div');
  const ph=document.createElement('div');ph.className='page-header';ph.style.marginBottom='1rem';
  ph.innerHTML=`<h2 style="font-family:'Lora',serif;font-size:26px;font-weight:400;color:#2c2a26">The Family Table</h2><p style="font-size:14px;color:#6b6966;margin-top:2px">Saved recipes — tap any to view. Add to next week from the meal ideas screen.</p>`;
  d.appendChild(ph);
  const favKeys=Object.keys(state.favorites);
  if(!favKeys.length){d.insertAdjacentHTML('beforeend',`<div class="empty-state"><p style="font-size:32px;margin-bottom:1rem">🤍</p><p>No saved recipes yet. Tap the heart on any recipe to save it here.</p></div>`);return d;}
  favKeys.forEach(name=>{
    const meal=state.favorites[name];
    const card=document.createElement('div');card.className='fav-card';
    card.innerHTML=`<div style="flex:1"><div class="fav-name">${name}</div><div class="fav-desc">${meal.description||''}</div></div><span style="font-size:20px;color:#e24b4a">♥</span>`;
    card.onclick=()=>{state.openRecipe=meal;render();};d.appendChild(card);
  });

}

function renderRecipeModal(){
  const meal=state.openRecipe;
  const overlay=document.createElement('div');overlay.className='recipe-modal';
  overlay.addEventListener('click',e=>{if(e.target===overlay){state.openRecipe=null;render();}});
  const sheet=document.createElement('div');sheet.className='recipe-sheet';
  const recipeTop=document.createElement('div');recipeTop.className='recipe-top';
  const titleWrap=document.createElement('div');titleWrap.style.flex='1';
  titleWrap.innerHTML=`<h2 style="font-family:'Lora',serif;font-size:22px;font-weight:400;margin-bottom:0.5rem">${meal.name}</h2><p style="font-size:14px;color:#888780">${meal.description||''}</p>`;
  const actions=document.createElement('div');actions.className='recipe-actions';
  const heartBtn=document.createElement('button');heartBtn.className='heart-btn';heartBtn.textContent=isFav(meal.name)?'♥':'🤍';
  heartBtn.title=isFav(meal.name)?'Remove from saved':'Save recipe';
  heartBtn.addEventListener('click',()=>{toggleFav(meal);heartBtn.textContent=isFav(meal.name)?'♥':'🤍';});
  const closeBtn=document.createElement('button');closeBtn.className='close-btn';closeBtn.textContent='×';closeBtn.addEventListener('click',()=>{state.openRecipe=null;render();});
  actions.appendChild(heartBtn);actions.appendChild(closeBtn);
  recipeTop.appendChild(titleWrap);recipeTop.appendChild(actions);sheet.appendChild(recipeTop);
  if(meal.time)sheet.insertAdjacentHTML('beforeend',`<span class="badge" style="margin-bottom:1rem;display:inline-block">${meal.time} min</span>`);
  if(meal.ingredients){sheet.insertAdjacentHTML('beforeend',`<h3 style="margin-top:1rem;margin-bottom:0.5rem">Ingredients</h3><ul class="ing-list">${meal.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>`);}
  if(meal.steps){sheet.insertAdjacentHTML('beforeend',`<h3 style="margin-top:1.25rem;margin-bottom:0.75rem">Steps</h3>`);meal.steps.forEach((s,i)=>{sheet.insertAdjacentHTML('beforeend',`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`);});}
  if(meal.kidNote)sheet.insertAdjacentHTML('beforeend',`<div style="margin-top:1rem;padding:0.75rem 1rem;background:#eaf3de;border-radius:10px;font-size:13px;color:#3b6d11">${meal.kidNote}</div>`);
  if(meal.kidMeal)sheet.insertAdjacentHTML('beforeend',`<div style="margin-top:1rem;padding:0.75rem 1rem;background:#eaf3de;border-radius:10px"><div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#639922;margin-bottom:4px">For the kids</div><div style="font-size:13px;color:#3b6d11">${meal.kidMeal}</div></div>`);
  overlay.appendChild(sheet);return overlay;
}

function sendEmailPlan(email){
  let body='Your Family Table meal plan for this week:\n\n';
  state.weekSlots.forEach(slot=>{
    body+=slot.day+': ';
    if(slot.assigned&&slot.assigned.type==='meal'){body+=slot.assigned.name+'\n';if(slot.assigned.ingredients)body+='Ingredients: '+slot.assigned.ingredients.join(', ')+'\n';if(slot.assigned.steps)body+='Steps:\n'+slot.assigned.steps.map((s,i)=>`${i+1}. ${s}`).join('\n')+'\n';}
    else if(slot.assigned&&slot.assigned.type==='special'){const tl=slot.assigned.special==='out'?'Dinner out':slot.assigned.special==='order'?'Order in':'Leftovers';body+=tl+(slot.assigned.note?' — '+slot.assigned.note:'')+'\n';}
    else body+='Nothing planned\n';
    body+='\n';
  });
  if(state.groceryList){body+='\nGrocery List:\n';Object.entries(state.groceryList).forEach(([cat,items])=>{if(items&&items.length){body+=cat+':\n'+items.map(i=>'• '+i).join('\n')+'\n\n';}});}
  if(state.manualGrocery.length){body+='Also need:\n'+state.manualGrocery.map(i=>'• '+i).join('\n')+'\n';}
  window.location.href=`mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent('Your Family Table meal plan this week')}&body=${encodeURIComponent(body)}`;
}

async function callAI(prompt,maxTokens=2500){
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:maxTokens,messages:[{role:'user',content:prompt}]})
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error.message||'API error');
  return data.content.map(c=>c.text||'').join('');
}

async function generateMealOptions(){
  state.loadingMsg='Finding meal ideas for your family...';state.loadingSub='This takes about 10 seconds';state.loading=true;render();
  const {kids,cookTime,restrictions,picky,tasteProfile}=state.profile;
  const tasteStr=tasteProfile&&tasteProfile.length?`Taste preferences: ${tasteProfile.join(', ')}.`:'';
  const prompt=`You are a family meal planner. Generate 8 diverse meal ideas for a family.
Family: kids ages ${kids.length?kids.join(', '):'not specified'}. Max cook time: ${cookTime} minutes. Dietary restrictions: ${restrictions||'none'}. Foods kids won't eat: ${picky||'none'}.
${tasteStr}
Return ONLY valid JSON, no markdown:
{"meals":[{"name":"Meal name","description":"One appetizing sentence under 15 words"}]}
Make meals varied and strongly match taste preferences. Simple appealing family names.`;
  try{
    const text=await callAI(prompt,800);
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    state.mealOptions=parsed.meals;state.selectedMeals={};state.planStep='ideas';persist();
  }catch(e){alert('Something went wrong. Please try again.');console.error(e);}
  state.loading=false;render();
}

async function loadMoreMealOptions(){
  state.loadingMsg='Finding more ideas...';state.loadingSub='Keeping your selections';state.loading=true;render();
  const {kids,cookTime,restrictions,picky,tasteProfile}=state.profile;
  const tasteStr=tasteProfile&&tasteProfile.length?`Taste preferences: ${tasteProfile.join(', ')}.`:'';
  const existing=state.mealOptions.map(m=>m.name).join(', ');
  const prompt=`Generate 4 NEW meal ideas different from: ${existing}.
Family: kids ages ${kids.length?kids.join(', '):'not specified'}. Max cook time: ${cookTime} min. Restrictions: ${restrictions||'none'}. Kids won't eat: ${picky||'none'}. ${tasteStr}
Return ONLY valid JSON: {"meals":[{"name":"Meal name","description":"One sentence under 15 words"}]}`;
  try{
    const text=await callAI(prompt,400);
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    state.mealOptions=[...state.mealOptions,...parsed.meals.map(m=>({...m,isNew:true}))];persist();
  }catch(e){console.error(e);}
  state.loading=false;render();
}

async function generateRecipesAndGrocery(){
  const assignedMeals=state.weekSlots.filter(s=>s.assigned&&s.assigned.type==='meal'&&!s.assigned.isCustom).map(s=>s.assigned);
  state.loadingMsg='Writing your recipes and grocery list...';state.loadingSub='Almost there';state.loading=true;render();
  const {kids,cookTime,restrictions,picky,mealMode}=state.profile;
  const mealModeInstr=mealMode==='family'?'One meal the whole family eats together.':mealMode==='adapt'?'One meal with a kidNote on adapting for young children.':'Include a kidMeal field with a simple separate option for kids.';
  const prompt=`Write full recipes for: ${assignedMeals.map(m=>`"${m.name}"`).join(', ')}.
Family: kids ages ${kids.length?kids.join(', '):'not specified'}. Max cook time: ${cookTime} min. Restrictions: ${restrictions||'none'}. Kids won't eat: ${picky||'none'}.
Meal structure: ${mealModeInstr}
Return ONLY valid JSON, no markdown:
{"recipes":[{"name":"exact meal name","description":"one sentence","time":30,"ingredients":["amount + ingredient"],"steps":["step 1","step 2","step 3","step 4","step 5"],"kidNote":"tip or null","kidMeal":"kid option or null"}],"grocery":{"Produce":["2 zucchinis","1 bunch kale"],"Protein":["1 lb chicken thighs"],"Grains":["1 box pasta"],"Dairy":["1 cup Greek yogurt"],"Pantry":["1 can coconut milk"]}}
Include quantities on EVERY grocery item. List only what needs to be purchased — assume family has basic staples like olive oil, salt, pepper, garlic, onions, basic spices.`;
  try{
    const text=await callAI(prompt,3500);
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    const recipeMap={};parsed.recipes.forEach(r=>{recipeMap[r.name.toLowerCase()]=r;});
    state.weekSlots.forEach(slot=>{
      if(slot.assigned&&slot.assigned.type==='meal'&&!slot.assigned.isCustom){
        const key=slot.assigned.name.toLowerCase();
        const recipe=recipeMap[key]||parsed.recipes.find(r=>r.name.toLowerCase().includes(key.split(' ')[0])||key.includes(r.name.toLowerCase().split(' ')[0]));
        if(recipe)Object.assign(slot.assigned,recipe);
      }
    });
    state.groceryList=parsed.grocery;state.recipesGenerated=true;state.planStep='week';persist();
  }catch(e){console.error(e);}
  state.loading=false;render();
}

render();
</script>
