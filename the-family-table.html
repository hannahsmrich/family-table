<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Family Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#faf8f5;color:#2c2a26;min-height:100vh}
.app{max-width:680px;margin:0 auto;padding:1.5rem 1rem 7rem}
h1{font-family:'Lora',serif;font-size:28px;font-weight:400;color:#2c2a26;margin-bottom:4px}
h2{font-family:'Lora',serif;font-size:20px;font-weight:400;color:#2c2a26;margin-bottom:0.25rem}
h3{font-size:13px;font-weight:500;color:#5f5e5a;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.75rem}
p{font-size:15px;line-height:1.6;color:#5f5e5a}
.tagline{font-family:'Lora',serif;font-style:italic;font-size:16px;color:#888780;margin-bottom:2rem}
.card{background:#fff;border-radius:16px;border:0.5px solid #e8e5df;padding:1.25rem 1.5rem;margin-bottom:1rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:10px;border:0.5px solid #d3d1c7;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;color:#2c2a26}
.btn:hover{background:#f1efe8}
.btn-primary{background:#3b6d11;color:#fff;border-color:#3b6d11}
.btn-primary:hover{background:#27500a}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:15px}
input[type=text],input[type=number],select{width:100%;padding:10px 14px;border-radius:10px;border:0.5px solid #d3d1c7;background:#faf8f5;font-family:'DM Sans',sans-serif;font-size:14px;color:#2c2a26;outline:none;transition:border 0.15s}
input:focus,select:focus{border-color:#639922}
label{font-size:14px;font-weight:500;color:#444441;display:block;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:0.5px solid #d3d1c7;background:#fff;font-size:13px;cursor:pointer;transition:all 0.15s;color:#5f5e5a;font-family:'DM Sans',sans-serif;user-select:none}
.chip.active{background:#eaf3de;border-color:#639922;color:#3b6d11;font-weight:500}
.chip:hover:not(.active){background:#f1efe8}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:0.5rem}
.meal-mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.meal-mode-card{padding:12px;border-radius:10px;border:0.5px solid #d3d1c7;background:#fff;cursor:pointer;transition:all 0.15s;text-align:left}
.meal-mode-card:hover{background:#f1efe8}
.meal-mode-card.active{background:#eaf3de;border-color:#639922}
.meal-mode-card .mode-title{font-size:13px;font-weight:500;color:#2c2a26;margin-bottom:3px}
.meal-mode-card.active .mode-title{color:#3b6d11}
.meal-mode-card .mode-desc{font-size:12px;color:#888780;line-height:1.4}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.08em;color:#888780;margin:1.25rem 0 0.5rem;padding-top:1rem;border-top:0.5px solid #e8e5df}
.section-title:first-child{margin-top:0;padding-top:0;border-top:none}
.nav{display:flex;gap:4px;margin-bottom:2rem;background:#f1efe8;border-radius:12px;padding:4px}
.nav-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:#888780;transition:all 0.15s}
.nav-btn.active{background:#fff;color:#2c2a26;border:0.5px solid #e8e5df}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;background:#eaf3de;color:#3b6d11}
.add-link{font-size:13px;color:#639922;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;padding:0;text-decoration:underline;margin-top:4px}
.kid-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.remove-btn{background:none;border:none;cursor:pointer;color:#d3d1c7;font-size:18px;line-height:1;padding:0 4px}
.remove-btn:hover{color:#e24b4a}
.custom-input-row{display:flex;gap:8px;margin-top:8px}
.custom-input-row input{flex:1}
.loading{text-align:center;padding:4rem 1rem}
.loading-text{font-family:'Lora',serif;font-style:italic;font-size:18px;color:#888780;margin-top:1rem}
.loading-sub{font-size:13px;color:#b4b2a9;margin-top:0.5rem}
.spinner{width:44px;height:44px;border:2px solid #e8e5df;border-top:2px solid #639922;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ideas-header{margin-bottom:1.5rem}
.meal-idea-card{background:#fff;border-radius:14px;border:1.5px solid #e8e5df;padding:1rem 1.25rem;margin-bottom:10px;cursor:pointer;transition:all 0.15s;display:flex;align-items:flex-start;gap:14px}
.meal-idea-card:hover{border-color:#c0dd97;background:#fafff8}
.meal-idea-card.selected{border-color:#639922;background:#eaf3de}
.meal-idea-check{width:22px;height:22px;border-radius:6px;border:1.5px solid #d3d1c7;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:13px;color:#fff}
.meal-idea-card.selected .meal-idea-check{background:#639922;border-color:#639922}
.meal-idea-body{flex:1}
.meal-idea-name{font-family:'Lora',serif;font-size:16px;font-weight:400;color:#2c2a26;margin-bottom:3px}
.meal-idea-card.selected .meal-idea-name{color:#27500a}
.meal-idea-desc{font-size:13px;color:#888780;line-height:1.5}
.selection-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid #e8e5df;padding:1rem;z-index:50}
.selection-bar-inner{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.selection-count{font-size:13px;color:#888780;flex:1}
.week-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
.day-row{display:flex;align-items:stretch;gap:10px;min-height:72px}
.day-label{width:36px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.day-abbr{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#888780}
.day-slot{flex:1;border-radius:12px;border:0.5px solid #e8e5df;background:#fff;padding:10px 14px;cursor:pointer;transition:all 0.15s;position:relative;min-height:72px}
.day-slot.draggable{cursor:grab}
.day-slot.draggable:active{cursor:grabbing}
.day-slot.dragging{opacity:0.4;border-style:dashed}
.day-slot.drag-over{border-color:#639922;background:#eaf3de}
.day-slot.empty-slot{background:#faf8f5;border-style:dashed;display:flex;align-items:center;justify-content:center}
.day-slot.empty-slot:hover{background:#f1efe8;border-color:#c0dd97}
.slot-add-hint{font-size:13px;color:#c0dd97;font-weight:500}
.slot-meal-name{font-family:'Lora',serif;font-size:15px;font-weight:400;color:#2c2a26;margin-bottom:2px;line-height:1.3;padding-right:20px}
.slot-meal-desc{font-size:12px;color:#888780;line-height:1.4;padding-right:20px}
.slot-tag{font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;display:inline-block;margin-bottom:4px}
.tag-out{background:#faeeda;color:#ba7517}
.tag-order{background:#e6f1fb;color:#185fa5}
.tag-leftover{background:#eaf3de;color:#3b6d11}
.slot-actions{position:absolute;top:8px;right:10px;opacity:0;transition:opacity 0.15s}
.day-slot:hover .slot-actions{opacity:1}
.slot-action-btn{background:none;border:none;cursor:pointer;font-size:16px;color:#b4b2a9;padding:0;line-height:1}
.slot-action-btn:hover{color:#e24b4a}
.recipe-link{font-size:12px;color:#639922;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;padding:0;text-decoration:underline;margin-top:6px;display:block}
.tray-wrap{background:#fff;border:0.5px solid #e8e5df;border-radius:12px;padding:8px;margin-top:4px}
.option-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:background 0.1s}
.option-item:hover{background:#f1efe8}
.option-name{font-family:'Lora',serif;font-size:14px;color:#2c2a26;margin-bottom:2px}
.option-desc{font-size:12px;color:#888780}
.special-row{display:flex;gap:6px;margin-bottom:8px}
.special-btn{flex:1;padding:8px 4px;border-radius:8px;border:0.5px solid #e8e5df;background:#fff;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:background 0.1s}
.special-btn:hover{background:#f1efe8}
.tray-divider{height:0.5px;background:#f1efe8;margin:4px 0 8px}
.tray-label{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#888780;margin-bottom:6px;padding:0 4px}
.generate-bar{position:sticky;bottom:0;background:linear-gradient(to top,#faf8f5 70%,transparent);padding:1.5rem 0 0.5rem;margin-top:0.5rem}
.pantry-bar{position:sticky;bottom:0;padding:1.5rem 0 0.5rem;background:linear-gradient(to top,#faf8f5 70%,transparent)}
.grocery-section{margin-bottom:1.25rem}
.grocery-cat{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#639922;margin-bottom:0.5rem}
.grocery-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid #f1efe8;font-size:14px;color:#2c2a26}
.grocery-item:last-child{border-bottom:none}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid #c0dd97;background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all 0.15s;font-size:11px}
.check-box.checked{background:#639922;border-color:#639922;color:#fff}
.recipe-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,42,38,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.recipe-sheet{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;max-width:680px;width:100%;max-height:82vh;overflow-y:auto}
.close-btn{float:right;background:none;border:none;font-size:24px;cursor:pointer;color:#888780;line-height:1}
.step{display:flex;gap:12px;margin-bottom:1rem;font-size:14px;line-height:1.6;color:#444441}
.step-num{width:24px;height:24px;border-radius:50%;background:#eaf3de;color:#3b6d11;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.ing-list{margin:0.75rem 0;padding-left:1rem}
.ing-list li{font-size:14px;color:#444441;padding:3px 0;line-height:1.5}
.empty-state{text-align:center;padding:3rem 1rem;color:#888780;font-size:14px}
.api-key-screen{max-width:480px;margin:4rem auto;padding:2rem;text-align:center}
.api-key-screen h2{font-family:'Lora',serif;font-size:24px;font-weight:400;margin-bottom:0.75rem}
.api-key-screen p{font-size:14px;color:#888780;margin-bottom:1.5rem;line-height:1.6}
.api-key-input{display:flex;gap:8px;margin-bottom:0.75rem}
.api-key-input input{flex:1;font-family:monospace;font-size:13px}
.api-note{font-size:12px;color:#b4b2a9;line-height:1.5}
.error-msg{background:#fcebeb;border:0.5px solid #f09595;border-radius:10px;padding:10px 14px;font-size:13px;color:#a32d2d;margin-bottom:1rem}
</style>
</head>
<body>
<div class="app" id="root"></div>
<script>
const STORAGE_KEY='family-table-v1';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY=new Date();
const DAY_START=TODAY.getDay();
const WEEK_DAYS=DAYS.slice(DAY_START).concat(DAYS.slice(0,DAY_START));

const PANTRY={
  'Produce':['Kale','Arugula','Spinach','Carrots','Bell peppers','Tomatoes','Cucumbers','Zucchini','Broccoli','Sweet potatoes','Avocado','Lemons & limes','Fresh herbs'],
  'Protein':['Eggs','Chicken','Ground beef','Tofu','Tempeh','Tuna (canned)','Salmon','Edamame','Lentils','Black beans','Chickpeas'],
  'Grains':['Brown rice','White rice','Quinoa','Pasta','Whole wheat bread','Flour tortillas','Oats','Farro','Vermicelli noodles','Polenta'],
  'Dairy':['Milk','Butter','Cheddar cheese','Parmesan','Greek yogurt','Cream cheese','Sour cream'],
  'Pantry Staples':['Olive oil','Garlic & onions','Canned tomatoes','Coconut milk','Vegetable broth','Soy sauce','Curry paste','Miso','Salsa','Nut butters','Mixed nuts'],
  'Spices':['Salt & pepper','Cumin','Paprika','Turmeric','Cinnamon','Italian seasoning','Chili flakes','Garlic powder'],
};

function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{};}catch(e){return{};}}
function saveData(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){}}

let state={
  screen:'plan',planStep:'ideas',
  profile:null,pantry:{},customItems:[],
  mealOptions:[],selectedMeals:{},
  weekSlots:WEEK_DAYS.map(d=>({day:d,assigned:null})),
  recipesGenerated:false,groceryList:null,checkedGrocery:{},
  openRecipe:null,loading:false,loadingMsg:'',loadingSub:'',
  openTray:null,apiKey:'',apiKeyInput:'',apiError:'',
};
Object.assign(state,loadData());
if(!state.weekSlots||state.weekSlots.length!==7)state.weekSlots=WEEK_DAYS.map(d=>({day:d,assigned:null}));
if(!state.selectedMeals)state.selectedMeals={};
if(!state.planStep)state.planStep='ideas';
if(!state.apiKey)state.apiKey='';

function persist(){saveData({profile:state.profile,pantry:state.pantry,customItems:state.customItems,weekSlots:state.weekSlots,mealOptions:state.mealOptions,selectedMeals:state.selectedMeals,planStep:state.planStep,recipesGenerated:state.recipesGenerated,groceryList:state.groceryList,checkedGrocery:state.checkedGrocery,apiKey:state.apiKey});}

let dragSrc=null;
let onboardingForm={kids:[{age:''}],cookTime:'30',restrictions:'',picky:'',mealMode:'family'};

function pantryCount(){return Object.values(state.pantry).filter(Boolean).length+state.customItems.length;}
function selectedCount(){return Object.keys(state.selectedMeals).length;}

function render(){
  const root=document.getElementById('root');
  root.innerHTML='';
  if(!state.apiKey){root.appendChild(renderApiKeyScreen());return;}
  if(state.loading){root.appendChild(renderLoading());return;}
  if(state.openRecipe){root.appendChild(renderApp());root.appendChild(renderRecipeModal());return;}
  root.appendChild(renderApp());
}

function renderApiKeyScreen(){
  const d=document.createElement('div');d.className='api-key-screen';
  d.innerHTML=`<h2>The Family Table</h2><p>Enter your Anthropic API key to get started. Your key is saved in your browser and never sent anywhere except directly to Anthropic.</p>`;
  if(state.apiError){const err=document.createElement('div');err.className='error-msg';err.textContent=state.apiError;d.appendChild(err);}
  const row=document.createElement('div');row.className='api-key-input';
  const inp=document.createElement('input');inp.type='password';inp.placeholder='sk-ant-...';inp.value=state.apiKeyInput||'';
  inp.oninput=e=>{state.apiKeyInput=e.target.value;};
  const btn=document.createElement('button');btn.className='btn btn-primary';btn.textContent='Save';
  btn.onclick=async()=>{
    const key=state.apiKeyInput.trim();
    if(!key.startsWith('sk-')){state.apiError='That does not look like a valid API key. It should start with sk-ant-';render();return;}
    state.apiKey=key;state.apiError='';persist();render();
  };
  row.appendChild(inp);row.appendChild(btn);d.appendChild(row);
  d.insertAdjacentHTML('beforeend',`<p class="api-note">Your key is stored only in your browser's local storage. To get a key, visit <a href="https://console.anthropic.com" target="_blank" style="color:#639922">console.anthropic.com</a> and create one under API Keys.</p>`);
  return d;
}

function renderLoading(){
  const d=document.createElement('div');d.className='loading';
  d.innerHTML=`<div class="spinner"></div><p class="loading-text">${state.loadingMsg||'Thinking...'}</p><p class="loading-sub">${state.loadingSub||''}</p>`;
  return d;
}

function renderApp(){
  const wrap=document.createElement('div');
  if(!state.profile){wrap.appendChild(renderOnboarding());return wrap;}
  const hdr=document.createElement('div');hdr.className='header-row';
  hdr.innerHTML=`<div><h1>The Family Table</h1><p class="tagline">dinner planning made simple</p></div>`;
  const editBtn=document.createElement('button');editBtn.className='btn btn-sm';editBtn.textContent='Edit family';
  editBtn.onclick=()=>{state.profile=null;onboardingForm={kids:[{age:''}],cookTime:'30',restrictions:'',picky:'',mealMode:'family'};render();};
  hdr.appendChild(editBtn);wrap.appendChild(hdr);
  const nav=document.createElement('div');nav.className='nav';
  ['Plan','Pantry','Grocery list'].forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='nav-btn'+(state.screen===['plan','pantry','grocery'][i]?' active':'');
    b.textContent=t;b.onclick=()=>{state.screen=['plan','pantry','grocery'][i];state.openTray=null;render();};
    nav.appendChild(b);
  });
  wrap.appendChild(nav);
  if(state.screen==='plan'){
    if(!state.mealOptions.length)wrap.appendChild(renderPlanEmpty());
    else if(state.planStep==='ideas')wrap.appendChild(renderIdeaPicker());
    else wrap.appendChild(renderCalendar());
  }
  if(state.screen==='pantry')wrap.appendChild(renderPantry());
  if(state.screen==='grocery')wrap.appendChild(renderGrocery());
  return wrap;
}

function renderOnboarding(){
  const d=document.createElement('div');
  d.innerHTML=`<h1 style="margin-bottom:4px">The Family Table</h1><p class="tagline" style="margin-bottom:2rem">Let's get to know your family</p>`;
  const card=document.createElement('div');card.className='card';
  const kidsSection=document.createElement('div');
  kidsSection.innerHTML=`<h3>Kids in your family</h3><div id="kids-list"></div>`;
  const addKidBtn=document.createElement('button');addKidBtn.className='add-link';addKidBtn.textContent='+ Add another child';
  addKidBtn.onclick=()=>{onboardingForm.kids.push({age:''});renderKids();};kidsSection.appendChild(addKidBtn);
  function renderKids(){
    const list=kidsSection.querySelector('#kids-list');list.innerHTML='';
    onboardingForm.kids.forEach((k,i)=>{
      const row=document.createElement('div');row.className='kid-row';
      const ai=document.createElement('input');ai.type='number';ai.min='0';ai.max='18';ai.placeholder='age';ai.value=k.age;ai.style.width='80px';ai.oninput=e=>{onboardingForm.kids[i].age=e.target.value;};
      row.appendChild(Object.assign(document.createElement('span'),{textContent:`Child ${i+1}`,style:'font-size:14px;color:#5f5e5a;min-width:50px'}));
      row.appendChild(ai);
      row.appendChild(Object.assign(document.createElement('span'),{textContent:'years old',style:'font-size:14px;color:#888780'}));
      if(onboardingForm.kids.length>1){const rb=document.createElement('button');rb.className='remove-btn';rb.textContent='×';rb.dataset.i=i;rb.onclick=e=>{onboardingForm.kids.splice(parseInt(e.target.dataset.i),1);renderKids();};row.appendChild(rb);}
      list.appendChild(row);
    });
  }
  renderKids();card.appendChild(kidsSection);
  const modeSection=document.createElement('div');modeSection.style.marginTop='1.25rem';
  const modeGrid=document.createElement('div');modeGrid.className='meal-mode-grid';
  const modes=[{id:'family',title:'One family meal',desc:'Everyone eats the same thing'},{id:'adapt',title:'One meal, adapted',desc:'Notes for making it work for little ones'},{id:'separate',title:'Separate kid meal',desc:'A simple option just for the kids'}];
  function renderModes(){modeGrid.innerHTML='';modes.forEach(m=>{const c=document.createElement('div');c.className='meal-mode-card'+(onboardingForm.mealMode===m.id?' active':'');c.innerHTML=`<div class="mode-title">${m.title}</div><div class="mode-desc">${m.desc}</div>`;c.onclick=()=>{onboardingForm.mealMode=m.id;renderModes();};modeGrid.appendChild(c);});}
  modeSection.appendChild(Object.assign(document.createElement('label'),{textContent:'How do you want meals structured?'}));
  modeSection.appendChild(modeGrid);renderModes();card.appendChild(modeSection);
  const cookDiv=document.createElement('div');cookDiv.style.marginTop='1.25rem';cookDiv.innerHTML='<label>How long do you have to cook on a typical night?</label>';
  const cookSel=document.createElement('select');[['20','20 minutes or less'],['30','30 minutes'],['45','45 minutes'],['60','60 minutes'],['90','90+ minutes']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v==='30')o.selected=true;cookSel.appendChild(o);});cookDiv.appendChild(cookSel);card.appendChild(cookDiv);
  const restDiv=document.createElement('div');restDiv.style.marginTop='1.25rem';restDiv.innerHTML='<label>Dietary restrictions or allergies</label>';
  const restInput=document.createElement('input');restInput.type='text';restInput.placeholder='e.g. peanut allergy, vegetarian, no shellfish';restDiv.appendChild(restInput);card.appendChild(restDiv);
  const pickyDiv=document.createElement('div');pickyDiv.style.marginTop='1.25rem';pickyDiv.innerHTML="<label>Foods your kids won't touch</label>";
  const pickyInput=document.createElement('input');pickyInput.type='text';pickyInput.placeholder='e.g. mushrooms, spicy food, anything green';pickyDiv.appendChild(pickyInput);card.appendChild(pickyDiv);
  d.appendChild(card);
  const btn=document.createElement('button');btn.className='btn btn-primary btn-full';btn.textContent='Next: check your pantry →';
  btn.onclick=()=>{
    const kids=onboardingForm.kids.map(k=>parseInt(k.age)).filter(a=>!isNaN(a));
    state.profile={kids,cookTime:cookSel.value,restrictions:restInput.value,picky:pickyInput.value,mealMode:onboardingForm.mealMode};
    state.screen='pantry';persist();render();
  };
  d.appendChild(btn);return d;
}

function renderPlanEmpty(){
  const d=document.createElement('div');
  const box=document.createElement('div');box.className='card';
  const pc=pantryCount();
  box.innerHTML=`<h3>Ready to plan</h3><p style="font-size:14px;color:#888780;margin-bottom:1rem">${pc>0?`You have <strong>${pc} pantry items</strong> checked. The AI will use what you have to suggest meals.`:'Check off your pantry items so we can suggest meals you can actually make.'}</p>`;
  if(pc===0){const pb=document.createElement('button');pb.className='btn btn-full';pb.style.marginBottom='8px';pb.textContent='Go to pantry first';pb.onclick=()=>{state.screen='pantry';render();};box.appendChild(pb);}
  const btn=document.createElement('button');btn.className='btn btn-primary btn-full';btn.textContent='Get meal ideas';btn.onclick=generateMealOptions;box.appendChild(btn);
  d.appendChild(box);return d;
}

function renderIdeaPicker(){
  const d=document.createElement('div');
  d.innerHTML=`<div class="ideas-header"><h2>Pick your meals</h2><p style="font-size:14px;color:#888780;margin-top:4px">Choose the ones that sound good this week. Tap to select.</p></div>`;
  state.mealOptions.forEach((meal,i)=>{
    const isSelected=!!state.selectedMeals[i];
    const card=document.createElement('div');card.className='meal-idea-card'+(isSelected?' selected':'');
    const check=document.createElement('div');check.className='meal-idea-check';check.textContent=isSelected?'✓':'';
    const body=document.createElement('div');body.className='meal-idea-body';
    body.innerHTML=`<div class="meal-idea-name">${meal.name}</div><div class="meal-idea-desc">${meal.description}</div>`;
    card.appendChild(check);card.appendChild(body);
    card.addEventListener('click',()=>{
      if(state.selectedMeals[i])delete state.selectedMeals[i];
      else state.selectedMeals[i]=meal;
      persist();
      card.className='meal-idea-card'+(state.selectedMeals[i]?' selected':'');
      check.textContent=state.selectedMeals[i]?'✓':'';
      updateSelectionBar();
    });
    d.appendChild(card);
  });
  const refreshBtn=document.createElement('button');refreshBtn.className='btn';refreshBtn.style.cssText='margin-top:4px;width:100%;justify-content:center;';refreshBtn.textContent='Get different ideas';
  refreshBtn.onclick=()=>{state.selectedMeals={};generateMealOptions();};
  d.appendChild(refreshBtn);
  const bar=document.createElement('div');bar.className='selection-bar';
  const inner=document.createElement('div');inner.className='selection-bar-inner';
  const countEl=document.createElement('div');countEl.className='selection-count';countEl.id='selection-count';
  const sc=selectedCount();
  countEl.innerHTML=sc===0?'<span style="color:#b4b2a9">Tap meals to select them</span>':`<strong>${sc} meal${sc>1?'s':''}</strong> selected`;
  const goBtn=document.createElement('button');goBtn.className='btn btn-primary';goBtn.id='go-to-calendar';goBtn.textContent='Plan my week →';
  goBtn.style.opacity=sc===0?'0.4':'1';goBtn.style.pointerEvents=sc===0?'none':'auto';
  goBtn.onclick=()=>{
    if(selectedCount()===0)return;
    const meals=Object.values(state.selectedMeals);
    state.weekSlots=WEEK_DAYS.map(d=>({day:d,assigned:null}));
    meals.forEach((m,i)=>{if(i<7)state.weekSlots[i].assigned={type:'meal',...m};});
    state.planStep='calendar';state.recipesGenerated=false;state.groceryList=null;persist();render();
  };
  inner.appendChild(countEl);inner.appendChild(goBtn);bar.appendChild(inner);d.appendChild(bar);
  function updateSelectionBar(){
    const sc=selectedCount();
    const c=document.getElementById('selection-count');const g=document.getElementById('go-to-calendar');
    if(c)c.innerHTML=sc===0?'<span style="color:#b4b2a9">Tap meals to select them</span>':`<strong>${sc} meal${sc>1?'s':''}</strong> selected`;
    if(g){g.style.opacity=sc===0?'0.4':'1';g.style.pointerEvents=sc===0?'none':'auto';}
  }
  return d;
}

function renderCalendar(){
  const d=document.createElement('div');
  const topRow=document.createElement('div');topRow.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem';
  topRow.innerHTML=`<h2 style="margin:0">Your week</h2>`;
  const backBtn=document.createElement('button');backBtn.className='btn btn-sm';backBtn.textContent='← Back to ideas';backBtn.onclick=()=>{state.planStep='ideas';render();};
  topRow.appendChild(backBtn);d.appendChild(topRow);
  const hint=document.createElement('div');hint.className='card';hint.style.cssText='padding:10px 16px;margin-bottom:1rem;background:#f1efe8;border-color:#e8e5df';
  hint.innerHTML=`<p style="font-size:13px;color:#5f5e5a;margin:0">Drag meals to rearrange. Tap any slot to swap, or mark a night off.</p>`;
  d.appendChild(hint);
  const weekDiv=document.createElement('div');weekDiv.className='week-grid';
  state.weekSlots.forEach((slot,idx)=>{
    const container=document.createElement('div');
    const row=document.createElement('div');row.className='day-row';
    const lbl=document.createElement('div');lbl.className='day-label';lbl.innerHTML=`<span class="day-abbr">${slot.day.slice(0,3)}</span>`;row.appendChild(lbl);
    const slotEl=document.createElement('div');slotEl.className='day-slot';
    if(slot.assigned){
      const a=slot.assigned;
      if(a.type==='special'){
        const tc=a.special==='out'?'tag-out':a.special==='order'?'tag-order':'tag-leftover';
        const tl=a.special==='out'?'Dinner out':a.special==='order'?'Order in':'Leftovers';
        slotEl.innerHTML=`<span class="slot-tag ${tc}">${tl}</span>`;
      } else {
        slotEl.classList.add('draggable');
        slotEl.innerHTML=`<div class="slot-meal-name">${a.name}</div><div class="slot-meal-desc">${a.description||''}</div>`;
        if(state.recipesGenerated&&a.steps){const rl=document.createElement('button');rl.className='recipe-link';rl.textContent='View recipe';rl.onclick=e=>{e.stopPropagation();state.openRecipe=a;render();};slotEl.appendChild(rl);}
        slotEl.draggable=true;
        slotEl.addEventListener('dragstart',e=>{dragSrc=idx;slotEl.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
        slotEl.addEventListener('dragend',()=>slotEl.classList.remove('dragging'));
      }
      const acts=document.createElement('div');acts.className='slot-actions';
      const xBtn=document.createElement('button');xBtn.className='slot-action-btn';xBtn.textContent='×';
      xBtn.onclick=e=>{e.stopPropagation();state.weekSlots[idx].assigned=null;state.openTray=null;persist();render();};
      acts.appendChild(xBtn);slotEl.appendChild(acts);
    } else {
      slotEl.classList.add('empty-slot');slotEl.innerHTML=`<span class="slot-add-hint">+ add meal</span>`;
    }
    slotEl.addEventListener('dragover',e=>{e.preventDefault();slotEl.classList.add('drag-over');});
    slotEl.addEventListener('dragleave',()=>slotEl.classList.remove('drag-over'));
    slotEl.addEventListener('drop',e=>{
      e.preventDefault();slotEl.classList.remove('drag-over');
      if(dragSrc===null||dragSrc===idx)return;
      const tmp=state.weekSlots[dragSrc].assigned;state.weekSlots[dragSrc].assigned=state.weekSlots[idx].assigned;state.weekSlots[idx].assigned=tmp;
      dragSrc=null;persist();render();
    });
    slotEl.addEventListener('click',e=>{
      if(e.target.classList.contains('slot-action-btn')||e.target.classList.contains('recipe-link'))return;
      state.openTray=state.openTray===idx?null:idx;render();
    });
    row.appendChild(slotEl);container.appendChild(row);
    if(state.openTray===idx){
      const tray=document.createElement('div');tray.className='tray-wrap';
      const specRow=document.createElement('div');specRow.className='special-row';
      [{id:'out',label:'Dinner out',color:'#ba7517'},{id:'order',label:'Order in',color:'#185fa5'},{id:'leftover',label:'Leftovers',color:'#639922'}].forEach(s=>{
        const b=document.createElement('button');b.className='special-btn';b.textContent=s.label;b.style.color=s.color;
        b.onclick=e=>{e.stopPropagation();state.weekSlots[idx].assigned={type:'special',special:s.id};state.openTray=null;persist();render();};
        specRow.appendChild(b);
      });
      tray.appendChild(specRow);
      const selectedMealsList=Object.values(state.selectedMeals);
      if(selectedMealsList.length){
        tray.appendChild(Object.assign(document.createElement('div'),{className:'tray-divider'}));
        tray.appendChild(Object.assign(document.createElement('div'),{className:'tray-label',textContent:'Your selected meals'}));
        selectedMealsList.forEach(opt=>{
          const item=document.createElement('div');item.className='option-item';
          item.innerHTML=`<div class="option-name">${opt.name}</div><div class="option-desc">${opt.description||''}</div>`;
          item.onclick=e=>{e.stopPropagation();state.weekSlots[idx].assigned={type:'meal',...opt};state.openTray=null;persist();render();};
          tray.appendChild(item);
        });
      }
      container.appendChild(tray);
    }
    weekDiv.appendChild(container);
  });
  d.appendChild(weekDiv);
  const assignedMeals=state.weekSlots.filter(s=>s.assigned&&s.assigned.type==='meal');
  if(assignedMeals.length>0){
    const bar=document.createElement('div');bar.className='generate-bar';
    if(!state.recipesGenerated){
      const btn=document.createElement('button');btn.className='btn btn-primary btn-full';
      btn.textContent=`Get full recipes + grocery list (${assignedMeals.length} meal${assignedMeals.length>1?'s':''})`;
      btn.onclick=generateRecipesAndGrocery;bar.appendChild(btn);
    } else {
      const row2=document.createElement('div');row2.style.cssText='display:flex;gap:8px;';
      const gb=document.createElement('button');gb.className='btn btn-primary';gb.style.cssText='flex:1;justify-content:center';gb.textContent='View grocery list';gb.onclick=()=>{state.screen='grocery';render();};
      const rb=document.createElement('button');rb.className='btn';rb.style.cssText='flex:1;justify-content:center';rb.textContent='Start over';
      rb.onclick=()=>{state.mealOptions=[];state.selectedMeals={};state.weekSlots=WEEK_DAYS.map(d=>({day:d,assigned:null}));state.planStep='ideas';state.recipesGenerated=false;state.groceryList=null;state.checkedGrocery={};persist();render();};
      row2.appendChild(gb);row2.appendChild(rb);bar.appendChild(row2);
    }
    d.appendChild(bar);
  }
  return d;
}

function renderPantry(){
  const d=document.createElement('div');
  d.appendChild(Object.assign(document.createElement('div'),{innerHTML:`<h2>Your pantry</h2><p style="font-size:13px;color:#888780;margin-bottom:1.25rem">Check off what you have — saved week to week</p>`}));
  Object.entries(PANTRY).forEach(([cat,items])=>{
    const sec=document.createElement('div');
    sec.appendChild(Object.assign(document.createElement('div'),{className:'section-title',textContent:cat}));
    const grid=document.createElement('div');grid.className='chip-grid';
    items.forEach(item=>{
      const chip=document.createElement('button');chip.className='chip'+(state.pantry[item]?' active':'');chip.textContent=item;
      chip.addEventListener('click',()=>{state.pantry[item]=!state.pantry[item];chip.className='chip'+(state.pantry[item]?' active':'');persist();updatePantryBtn();});
      grid.appendChild(chip);
    });
    sec.appendChild(grid);d.appendChild(sec);
  });
  const customSec=document.createElement('div');
  customSec.appendChild(Object.assign(document.createElement('div'),{className:'section-title',textContent:'Your own items'}));
  const customGrid=document.createElement('div');customGrid.className='chip-grid';
  function renderCustomChips(){
    customGrid.innerHTML='';
    state.customItems.forEach((item,i)=>{
      const chip=document.createElement('button');chip.className='chip active';
      chip.appendChild(document.createTextNode(item+' '));const x=document.createElement('span');x.textContent='×';x.style.opacity='0.5';chip.appendChild(x);
      chip.addEventListener('click',()=>{state.customItems.splice(i,1);persist();renderCustomChips();updatePantryBtn();});
      customGrid.appendChild(chip);
    });
  }
  renderCustomChips();customSec.appendChild(customGrid);
  const addRow=document.createElement('div');addRow.className='custom-input-row';
  const addInput=document.createElement('input');addInput.type='text';addInput.placeholder='Add anything not on the list...';
  const addBtn=document.createElement('button');addBtn.className='btn btn-sm';addBtn.textContent='Add';
  addBtn.addEventListener('click',()=>{const val=addInput.value.trim();if(val&&!state.customItems.includes(val)){state.customItems.push(val);persist();renderCustomChips();updatePantryBtn();}addInput.value='';});
  addInput.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});
  addRow.appendChild(addInput);addRow.appendChild(addBtn);customSec.appendChild(addRow);d.appendChild(customSec);
  const bar=document.createElement('div');bar.className='pantry-bar';
  const barBtn=document.createElement('button');barBtn.className='btn btn-primary btn-full';barBtn.id='pantry-bar-btn';
  function updatePantryBtn(){const b=document.getElementById('pantry-bar-btn');if(!b)return;const pc=pantryCount();b.textContent=pc>0?`Get meal ideas with ${pc} item${pc>1?'s':''} →`:'Get meal ideas →';}
  updatePantryBtn();
  barBtn.onclick=()=>{state.screen='plan';state.planStep='ideas';render();if(!state.mealOptions.length)generateMealOptions();};
  bar.appendChild(barBtn);d.appendChild(bar);
  return d;
}

function renderGrocery(){
  const d=document.createElement('div');
  if(!state.groceryList){d.innerHTML=`<div class="empty-state"><p style="font-size:32px;margin-bottom:1rem">🛒</p><p>Finalize your meal plan first and tap "Get full recipes + grocery list."</p></div>`;return d;}
  const hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem';
  const h2=document.createElement('h2');h2.textContent='Grocery list';h2.style.margin='0';
  const copyBtn=document.createElement('button');copyBtn.className='btn btn-sm';copyBtn.textContent='Copy list';
  copyBtn.addEventListener('click',()=>{let text='Grocery List\n\n';Object.entries(state.groceryList).forEach(([cat,items])=>{if(items&&items.length){text+=cat+':\n';items.forEach(i=>{text+='• '+i+'\n';});text+='\n';}});navigator.clipboard.writeText(text).catch(()=>{});copyBtn.textContent='Copied!';setTimeout(()=>{copyBtn.textContent='Copy list';},2000);});
  hdr.appendChild(h2);hdr.appendChild(copyBtn);d.appendChild(hdr);
  Object.entries(state.groceryList).forEach(([cat,items])=>{
    if(!items||!items.length)return;
    const sec=document.createElement('div');sec.className='grocery-section';
    sec.appendChild(Object.assign(document.createElement('div'),{className:'grocery-cat',textContent:cat}));
    items.forEach(item=>{
      const row=document.createElement('div');row.className='grocery-item';
      const key=cat+':'+item;
      const box=document.createElement('div');box.className='check-box'+(state.checkedGrocery[key]?' checked':'');box.textContent=state.checkedGrocery[key]?'✓':'';
      const span=document.createElement('span');span.textContent=item;if(state.checkedGrocery[key])span.style.cssText='text-decoration:line-through;color:#b4b2a9';
      box.addEventListener('click',()=>{state.checkedGrocery[key]=!state.checkedGrocery[key];persist();box.className='check-box'+(state.checkedGrocery[key]?' checked':'');box.textContent=state.checkedGrocery[key]?'✓':'';span.style.cssText=state.checkedGrocery[key]?'text-decoration:line-through;color:#b4b2a9':'';});
      row.appendChild(box);row.appendChild(span);sec.appendChild(row);
    });
    d.appendChild(sec);
  });
  return d;
}

function renderRecipeModal(){
  const meal=state.openRecipe;
  const overlay=document.createElement('div');overlay.className='recipe-modal';
  overlay.addEventListener('click',e=>{if(e.target===overlay){state.openRecipe=null;render();}});
  const sheet=document.createElement('div');sheet.className='recipe-sheet';
  const closeBtn=document.createElement('button');closeBtn.className='close-btn';closeBtn.textContent='×';closeBtn.addEventListener('click',()=>{state.openRecipe=null;render();});
  sheet.appendChild(closeBtn);
  sheet.insertAdjacentHTML('beforeend',`<h2 style="font-family:'Lora',serif;font-size:22px;font-weight:400;margin-bottom:0.5rem;margin-right:2rem">${meal.name}</h2><p style="font-size:14px;color:#888780;margin-bottom:1rem">${meal.description||''}</p>${meal.time?`<span class="badge">${meal.time} min</span>`:''}`);
  if(meal.ingredients){sheet.insertAdjacentHTML('beforeend',`<h3 style="margin-top:1.25rem;margin-bottom:0.5rem">Ingredients</h3><ul class="ing-list">${meal.ingredients.map(i=>`<li>${i}</li>`).join('')}</ul>`);}
  if(meal.steps){sheet.insertAdjacentHTML('beforeend',`<h3 style="margin-top:1.25rem;margin-bottom:0.75rem">Steps</h3>`);meal.steps.forEach((s,i)=>{sheet.insertAdjacentHTML('beforeend',`<div class="step"><div class="step-num">${i+1}</div><div>${s}</div></div>`);});}
  if(meal.kidNote)sheet.insertAdjacentHTML('beforeend',`<div style="margin-top:1rem;padding:0.75rem 1rem;background:#eaf3de;border-radius:10px;font-size:13px;color:#3b6d11">${meal.kidNote}</div>`);
  if(meal.kidMeal)sheet.insertAdjacentHTML('beforeend',`<div style="margin-top:1rem;padding:0.75rem 1rem;background:#eaf3de;border-radius:10px"><div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:#639922;margin-bottom:4px">For the kids</div><div style="font-size:13px;color:#3b6d11">${meal.kidMeal}</div></div>`);
  overlay.appendChild(sheet);return overlay;
}

async function callAI(prompt){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':state.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-opus-4-5',max_tokens:2500,messages:[{role:'user',content:prompt}]})
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data.content.map(c=>c.text||'').join('');
}

async function generateMealOptions(){
  state.loadingMsg='Finding meal ideas for your family...';state.loadingSub='This takes about 10 seconds';state.loading=true;render();
  const checkedItems=[...Object.entries(state.pantry).filter(([k,v])=>v).map(([k])=>k),...state.customItems];
  const {kids,cookTime,restrictions,picky}=state.profile;
  const prompt=`You are a family meal planner. Generate 8 diverse meal ideas for a family.
Family: kids ages ${kids.length?kids.join(', '):'not specified'}. Max cook time: ${cookTime} minutes. Dietary restrictions: ${restrictions||'none'}. Foods kids won't eat: ${picky||'none'}.
Available pantry: ${checkedItems.length?checkedItems.join(', '):'standard pantry staples'}.
Return ONLY valid JSON, no markdown, no backticks:
{"meals":[{"name":"Meal name","description":"One appetizing sentence under 15 words"}]}
Make meals varied — different proteins, cuisines, styles. Simple appealing family names.`;
  try{
    const text=await callAI(prompt);
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    state.mealOptions=parsed.meals;state.selectedMeals={};state.planStep='ideas';persist();
  }catch(e){
    state.apiError='Could not connect to AI. Check your API key is correct.';
    state.apiKey='';persist();
  }
  state.loading=false;render();
}

async function generateRecipesAndGrocery(){
  const assignedMeals=state.weekSlots.filter(s=>s.assigned&&s.assigned.type==='meal').map(s=>s.assigned);
  state.loadingMsg='Writing your recipes and grocery list...';state.loadingSub='Almost there';state.loading=true;render();
  const checkedItems=[...Object.entries(state.pantry).filter(([k,v])=>v).map(([k])=>k),...state.customItems];
  const {kids,cookTime,restrictions,picky,mealMode}=state.profile;
  const mealModeInstr=mealMode==='family'?'One meal the whole family eats together.':mealMode==='adapt'?'One meal with a kidNote on adapting for young children.':'Include a kidMeal field with a simple separate option for kids.';
  const prompt=`Write full recipes for: ${assignedMeals.map(m=>`"${m.name}"`).join(', ')}.
Family: kids ages ${kids.length?kids.join(', '):'not specified'}. Max cook time: ${cookTime} min. Restrictions: ${restrictions||'none'}. Kids won't eat: ${picky||'none'}.
Meal structure: ${mealModeInstr}
Pantry available: ${checkedItems.length?checkedItems.join(', '):'standard staples'}.
Return ONLY valid JSON, no markdown:
{"recipes":[{"name":"exact meal name","description":"one sentence","time":30,"ingredients":["amount + ingredient"],"steps":["step 1","step 2","step 3","step 4","step 5"],"kidNote":"tip or null","kidMeal":"kid option or null"}],"grocery":{"Produce":["item"],"Protein":["item"],"Grains":["item"],"Dairy":["item"],"Pantry":["item"]}}
Grocery = only what they still need to buy. Ingredients = everything needed.`;
  try{
    const text=await callAI(prompt);
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    const recipeMap={};parsed.recipes.forEach(r=>{recipeMap[r.name.toLowerCase()]=r;});
    state.weekSlots.forEach(slot=>{
      if(slot.assigned&&slot.assigned.type==='meal'){
        const key=slot.assigned.name.toLowerCase();
        const recipe=recipeMap[key]||parsed.recipes.find(r=>r.name.toLowerCase().includes(key.split(' ')[0])||key.includes(r.name.toLowerCase().split(' ')[0]));
        if(recipe)Object.assign(slot.assigned,recipe);
      }
    });
    state.groceryList=parsed.grocery;state.recipesGenerated=true;persist();
  }catch(e){console.error(e);}
  state.loading=false;render();
}

render();
</script>
